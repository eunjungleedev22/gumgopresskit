name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/dj-gumgo-presskit-kwK7B

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GIGS_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQJYlWV_4UwwvW2FMbMEy26lBnQbTKulCOMTTHHL10LUQPagy-DYWXL8bEXrBH28lPUe0LYTlDBc4dv/pub?gid=0&single=true&output=csv
          VITE_VIDEOS_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQJYlWV_4UwwvW2FMbMEy26lBnQbTKulCOMTTHHL10LUQPagy-DYWXL8bEXrBH28lPUe0LYTlDBc4dv/pub?gid=2093848781&single=true&output=csv
          VITE_MIXES_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQJYlWV_4UwwvW2FMbMEy26lBnQbTKulCOMTTHHL10LUQPagy-DYWXL8bEXrBH28lPUe0LYTlDBc4dv/pub?output=csv
          VITE_PRESS_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQJYlWV_4UwwvW2FMbMEy26lBnQbTKulCOMTTHHL10LUQPagy-DYWXL8bEXrBH28lPUe0LYTlDBc4dv/pub?gid=553984899&single=true&output=csv
          VITE_BIO_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQJYlWV_4UwwvW2FMbMEy26lBnQbTKulCOMTTHHL10LUQPagy-DYWXL8bEXrBH28lPUe0LYTlDBc4dv/pub?gid=107729554&single=true&output=csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
