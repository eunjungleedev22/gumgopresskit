<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — GUMGO</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@100..900&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #060608;
        color: #aaaaaa;
        font-family: 'Outfit', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-end;
        padding: clamp(40px, 8vw, 96px) clamp(24px, 5vw, 64px);
        min-height: 100svh;
      }
      .code {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #666;
        margin-bottom: 20px;
      }
      h1 {
        font-family: 'Outfit', system-ui, sans-serif;
        font-size: clamp(64px, 14vw, 100px);
        font-weight: 800;
        line-height: 0.92;
        letter-spacing: -0.04em;
        color: #ffffff;
        margin-bottom: 32px;
      }
      p {
        font-size: 16px;
        line-height: 1.7;
        color: #888;
        max-width: 380px;
        margin-bottom: 40px;
      }
      a {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #e8eaf0;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        opacity: 0.7;
        transition: opacity 0.2s, gap 0.2s;
      }
      a:hover { opacity: 1; gap: 14px; }
      a::before {
        content: '';
        display: block;
        width: 28px;
        height: 1px;
        background: currentColor;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <p class="code">404</p>
    <h1>GUMGO</h1>
    <p>This page doesn't exist. Maybe it moved, or maybe it never did.</p>
    <a href="/">Back to press kit</a>
  </body>
</html>
