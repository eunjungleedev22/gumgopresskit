<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GUMGO">
  <rect width="32" height="32" fill="#000000"/>
  <!-- Baseline is set explicitly rather than with dominant-baseline, which
       favicon renderers treat inconsistently. Verdana first, to match the
       page; the fallbacks are installed everywhere the first is not. -->
  <text x="16" y="24"
        fill="#ffffff"
        font-family="Verdana, Geneva, Arial, Helvetica, sans-serif"
        font-size="23"
        font-weight="bold"
        text-anchor="middle">G</text>
</svg>
